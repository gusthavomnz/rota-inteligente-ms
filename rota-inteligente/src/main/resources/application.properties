spring.application.name=rota-inteligente
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=rotainteligente;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SUA_SENHA}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
# Essa linha é obrigatória quando o banco já existe
spring.flyway.baseline-on-migrate=true
# Garante que ele procure no lugar certo
spring.flyway.locations=classpath:db/migration